# From the repo root:  docker compose -f docker/docker-compose.yml --env-file .env up -d --build
services:
  web:
    build: { context: .., dockerfile: docker/web.Dockerfile }
    env_file: ../.env
    environment:
      # Server-side calls stay on the internal network.
      API_URL: http://api:8787
    restart: unless-stopped

  api:
    build: { context: .., dockerfile: docker/api.Dockerfile }
    env_file: ../.env
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
